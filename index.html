<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreyansh Kushwaha — Electrical Engineer</title>
<meta name="description" content="Shreyansh Kushwaha — B.Tech Electrical Engineering. CAD design, renewable energy, embedded systems and IoT. Working prototypes and the documentation behind them.">
<meta property="og:title" content="Shreyansh Kushwaha — Electrical Engineer">
<meta property="og:description" content="CAD Design · Renewable Energy · Embedded Systems & IoT">
<meta property="og:url" content="https://shrewaha.in">
<meta name="theme-color" content="#0a0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13; --bg2:#0f141b; --card:#121821; --line:#1f2834; --line2:#2a3646;
  --text:#e8edf3; --muted:#8e9aab; --faint:#5d6878;
  --accent:#c4f135; --accent-ink:#121a02; --accent-soft:rgba(196,241,53,.10);
  --radius:18px; --max:1120px; --shadow:0 20px 50px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f6f7f4; --bg2:#eef0ea; --card:#ffffff; --line:#e1e5dc; --line2:#cfd6c8;
  --text:#11160d; --muted:#556052; --faint:#8a9486;
  --accent:#4d7c0f; --accent-ink:#ffffff; --accent-soft:rgba(77,124,15,.09);
  --shadow:0 20px 50px rgba(30,40,20,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:80px}
body{margin:0; background:var(--bg); color:var(--text); font:16px/1.6 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s,color .3s}
a{color:inherit}
svg{display:block}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif; letter-spacing:-.02em; line-height:1.1; margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:var(--max); margin:0 auto; padding:0 20px}
.skip{position:absolute; left:-999px; top:8px; background:var(--accent); color:var(--accent-ink); padding:8px 14px; border-radius:8px; z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}

/* Header */
header{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.progress{position:absolute; left:0; bottom:-1px; height:2px; width:100%; background:var(--accent); transform-origin:left; transform:scaleX(0)}
.nav{display:flex; align-items:center; justify-content:space-between; height:64px}
.logo{font:700 15px "Space Grotesk",sans-serif; letter-spacing:.08em; text-decoration:none; display:flex; align-items:center; gap:8px; text-transform:uppercase}
.logo i{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent)}
.links{display:flex; gap:2px; list-style:none; margin:0; padding:0}
.links a{display:block; padding:8px 12px; border-radius:10px; font-size:14px; color:var(--muted); text-decoration:none; transition:.2s}
.links a:hover{color:var(--text)}
.links a.active{color:var(--text); background:var(--accent-soft)}
.nav-r{display:flex; gap:6px; align-items:center}
.icon-btn{width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer}
.icon-btn svg{width:18px; height:18px}
.menu-btn{display:none}
@media (max-width:900px){
  .menu-btn{display:grid}
  .links{position:fixed; inset:64px 0 auto 0; flex-direction:column; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px 18px; transform:translateY(-8px); opacity:0; pointer-events:none; transition:.25s}
  .links.open{transform:none; opacity:1; pointer-events:auto}
  .links a{padding:12px; font-size:16px}
}

/* Common */
section{padding:96px 0; position:relative}
.eyebrow{font:500 12px "JetBrains Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 14px; display:flex; align-items:center; gap:10px}
.eyebrow::before{content:""; width:22px; height:1px; background:currentColor}
.h2{font-size:clamp(30px,4.4vw,46px); margin-bottom:18px; max-width:20ch}
.lead{color:var(--muted); font-size:17px; max-width:62ch; margin:0}
.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:12px; font:600 15px Inter,sans-serif; text-decoration:none; border:1px solid var(--line2); background:var(--card); color:var(--text); cursor:pointer; transition:transform .15s,border-color .2s}
.btn:hover{transform:translateY(-2px); border-color:var(--muted)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.sm{padding:9px 14px; font-size:14px; border-radius:10px}
.btn svg{width:16px; height:16px}
.chip{display:inline-block; font-size:12.5px; padding:5px 11px; border-radius:99px; border:1px solid var(--line2); color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); position:relative; overflow:hidden}
.spot::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%), var(--accent-soft), transparent 60%)}
.spot:hover::after{opacity:1}
.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease}
.reveal.in{opacity:1; transform:none}
.preview .reveal{opacity:1; transform:none; transition:none}

/* Hero */
#home{padding:88px 0 96px; overflow:hidden}
.grid-bg{position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px; mask-image:radial-gradient(ellipse 70% 60% at 70% 30%,#000 20%,transparent 75%); -webkit-mask-image:radial-gradient(ellipse 70% 60% at 70% 30%,#000 20%,transparent 75%)}
.hero{position:relative}
.hero > div{max-width:760px}
.hero.has-photo{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:56px; align-items:center}
.hero .photo{position:relative; justify-self:end; width:100%; max-width:340px}
.hero .photo.hidden{display:none}
.photo::before{content:""; position:absolute; inset:-14px; border-radius:36px; border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent); transform:rotate(-3deg); pointer-events:none}
.photo-frame{position:relative; aspect-ratio:1; border-radius:28px; overflow:hidden; border:1px solid var(--line2); background:var(--card); box-shadow:var(--shadow); transform:rotate(2deg); transition:transform .4s ease}
.photo:hover .photo-frame{transform:rotate(0) scale(1.02)}
.photo-frame img{width:100%; height:100%; object-fit:cover; display:block}
.photo-tag{position:absolute; left:-18px; bottom:22px; background:var(--card); border:1px solid var(--line2); border-radius:12px; padding:8px 12px; font:500 12px "JetBrains Mono",monospace; display:flex; gap:8px; align-items:center; box-shadow:var(--shadow)}
.photo-tag i{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none}
@media (max-width:860px){
  .hero.has-photo{grid-template-columns:1fr; gap:36px}
  .hero .photo{order:-1; justify-self:start; max-width:170px}
  .photo::before{inset:-8px; border-radius:30px}
  .photo-tag{display:none}
}
.hero h1{font-size:clamp(42px,7vw,76px); margin:6px 0 18px}
.typed{font:500 clamp(18px,2.4vw,22px) "Space Grotesk",sans-serif; color:var(--muted); min-height:1.5em; margin:0 0 18px}
.typed b{color:var(--text); font-weight:600; border-right:2px solid var(--accent); padding-right:3px; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
.hero p.tag{color:var(--muted); max-width:52ch; margin:0 0 26px}
.loc{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); margin-bottom:28px}
.loc svg{width:15px; height:15px}
.hero-ctas{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px}
.socials{display:flex; gap:8px}
.socials a{width:42px; height:42px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--card); transition:.2s}
.socials a:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-2px)}
.socials svg{width:18px; height:18px}

/* About */
.about{display:grid; grid-template-columns:1.2fr .8fr; gap:48px}
.about-meta{display:grid; gap:18px; margin-top:28px}
.about-meta h4{margin:0 0 8px; font:500 12px "JetBrains Mono",monospace; color:var(--faint); text-transform:uppercase; letter-spacing:.1em}
.stats{display:grid; gap:12px; align-content:start}
.stat{padding:22px 24px; display:flex; justify-content:space-between; align-items:flex-end}
.stat b{font:700 44px "Space Grotesk",sans-serif; line-height:1; color:var(--accent)}
.stat span{color:var(--muted); font-size:14px; text-align:right; max-width:14ch}

/* Timeline */
.timeline{margin-top:44px; position:relative; padding-left:28px}
.timeline::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line)}
.tl-fill{position:absolute; left:6px; top:8px; width:2px; background:var(--accent); height:0; transition:height .2s linear}
.tl-item{position:relative; margin-bottom:16px}
.tl-item::before{content:""; position:absolute; left:-27px; top:26px; width:12px; height:12px; border-radius:50%; background:var(--bg); border:2px solid var(--line2); transition:.3s}
.tl-item.in::before{border-color:var(--accent); background:var(--accent)}
.tl-card{padding:22px 24px}
.tl-top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline}
.tl-top h3{font-size:20px}
.tl-top .chip{vertical-align:middle; margin-left:6px; font-family:Inter,sans-serif; letter-spacing:0}
.when{font:500 12.5px "JetBrains Mono",monospace; color:var(--muted)}
.org{color:var(--accent); font-weight:600; font-size:14.5px; margin:4px 0 10px}
.tl-card p{color:var(--muted); margin:0}
.tl-more{all:unset; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--text); margin-top:12px; display:inline-flex; align-items:center; gap:6px}
.tl-more:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.tl-more svg{width:14px; height:14px; transition:transform .25s}
.tl-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.tl-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease}
.tl-body.open{grid-template-rows:1fr}
.tl-body > div{overflow:hidden}
.tl-body ul{margin:12px 0 0; padding-left:18px; color:var(--muted)}
.tl-body li{margin-bottom:6px}
.tl-body .chips{margin-top:12px}

/* Projects */
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-top:20px}
.filter{all:unset; cursor:pointer; font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:99px; border:1px solid var(--line2); color:var(--muted); transition:.2s}
.filter:hover{color:var(--text)}
.filter[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text)}
.filter:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.p-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:32px}
.proj{padding:26px; display:flex; flex-direction:column; transition:opacity .35s, transform .35s, border-color .2s}
.proj:hover{border-color:var(--line2)}
.proj.wide{grid-column:1/-1}
.proj.hide{display:none}
.proj.fading{opacity:0; transform:scale(.97)}
.p-badge{align-self:flex-start; font:500 11px "JetBrains Mono",monospace; text-transform:uppercase; letter-spacing:.08em; padding:4px 9px; border-radius:6px; background:var(--accent-soft); color:var(--accent); margin-bottom:14px}
.p-icon{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--bg2); border:1px solid var(--line); margin-bottom:16px}
.p-icon svg{width:22px; height:22px; color:var(--accent)}
.proj h3{font-size:21px; margin-bottom:10px}
.proj p{color:var(--muted); margin:0 0 18px; flex:1}
.proj .chips{margin-top:auto}
.p-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}

.feat{display:grid; grid-template-columns:1.2fr .8fr; gap:32px; padding:32px}
.feat > div:first-child{display:flex; flex-direction:column}
.feat h3{font-size:26px}
.feat p{flex:none}
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 14px}
.step{all:unset; cursor:pointer; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--bg2); transition:.2s}
.step b{display:block; font:500 11px "JetBrains Mono",monospace; color:var(--accent)}
.step span{font-size:14px; font-weight:600}
.step[aria-selected="true"]{border-color:var(--accent); background:var(--accent-soft)}
.step:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.step-desc{color:var(--muted); font-size:14.5px; min-height:46px; margin:0 0 18px}
.feat-ctas{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.dl{position:relative}
.dl-menu{position:absolute; bottom:calc(100% + 8px); left:0; min-width:220px; z-index:5; background:var(--card); border:1px solid var(--line2); border-radius:14px; padding:6px; box-shadow:var(--shadow); display:none}
.dl-menu.open{display:block}
.dl-menu a{display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-radius:10px; text-decoration:none; font-size:14px}
.dl-menu a:hover,.dl-menu a:focus-visible{background:var(--bg2); outline:none}
.dl-menu small{color:var(--muted)}
.phone-stage{display:flex; justify-content:center; align-items:center}
.phone{width:240px; height:480px; border-radius:36px; padding:11px; background:#0a0c10; border:1px solid #2b3040; box-shadow:var(--shadow)}
.screen{width:100%; height:100%; border-radius:26px; background:#f7f8fa; color:#10131a; overflow:hidden; position:relative; font-size:12.5px}
.notch{width:84px; height:20px; background:#0a0c10; border-radius:0 0 13px 13px; margin:0 auto}
.view{position:absolute; inset:32px 12px 12px; opacity:0; transform:translateY(10px); transition:.35s; pointer-events:none}
.view.active{opacity:1; transform:none}
.app-h{font:700 15px "Space Grotesk",sans-serif; margin:4px 0 10px}
.fld{background:#fff; border:1px solid #e3e6ec; border-radius:11px; padding:9px 11px; margin-bottom:7px}
.fld small{display:block; color:#7a8193; font-size:10.5px}
.pill{display:inline-block; background:#e9fbef; color:#127a3a; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:99px}
.fbtn{background:#16a34a; color:#fff; text-align:center; font-weight:600; padding:10px; border-radius:11px; margin-top:10px}
.offer{display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid #e3e6ec; border-radius:11px; padding:9px 11px; margin-bottom:7px; animation:oin .4s both}
.offer:nth-of-type(2){animation-delay:.12s}.offer:nth-of-type(3){animation-delay:.24s}
.offer.best{border-color:#16a34a; box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.price{font:700 14px "Space Grotesk",sans-serif}
.bar{height:5px; border-radius:5px; background:#e3e6ec; margin-top:6px; overflow:hidden}
.bar i{display:block; height:100%; background:#16a34a}
@keyframes oin{from{opacity:0; transform:translateX(12px)}to{opacity:1; transform:none}}

/* Skills */
.skills{display:grid; grid-template-columns:260px 1fr; gap:24px; margin-top:40px}
.s-tabs{display:flex; flex-direction:column; gap:6px}
.s-tab{all:unset; cursor:pointer; padding:14px 16px; border-radius:14px; border:1px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-weight:500; transition:.2s}
.s-tab:hover{color:var(--text); background:var(--card)}
.s-tab[aria-selected="true"]{color:var(--text); background:var(--card); border-color:var(--line2)}
.s-tab[aria-selected="true"] .n{background:var(--accent); color:var(--accent-ink)}
.s-tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.n{font:500 11px "JetBrains Mono",monospace; padding:2px 7px; border-radius:6px; background:var(--bg2)}
.s-panel{padding:30px; min-height:280px}
.s-panel h3{font-size:24px; margin-bottom:6px}
.s-panel > p{color:var(--muted); margin:0 0 22px}
.s-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px}
.s-item{padding:14px 16px; border-radius:12px; background:var(--bg2); border:1px solid var(--line); font-weight:500; display:flex; align-items:center; gap:10px; animation:oin .35s both}
.s-item::before{content:""; width:6px; height:6px; border-radius:2px; background:var(--accent); flex:none}

/* Achievements */
.ach{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:40px}
.ach .card{padding:24px}
.ach .k{font:500 11px "JetBrains Mono",monospace; color:var(--accent); text-transform:uppercase; letter-spacing:.08em}
.ach h3{font-size:17px; margin:12px 0 8px; line-height:1.3}
.ach p{color:var(--muted); font-size:14px; margin:0}

/* Contact */
.contact{padding:48px; display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center}
.contact .h2{max-width:none}
.c-list{display:grid; gap:10px}
.c-row{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; background:var(--bg2); border:1px solid var(--line); text-decoration:none; transition:.2s}
a.c-row:hover{border-color:var(--accent)}
.c-row svg{width:18px; height:18px; color:var(--accent); flex:none}
.c-row div{flex:1; min-width:0}
.c-row small{display:block; font:500 11px "JetBrains Mono",monospace; color:var(--faint); text-transform:uppercase; letter-spacing:.08em}
.c-row span{font-weight:500; overflow-wrap:anywhere}
.copy{all:unset; cursor:pointer; font-size:13px; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--line2)}
.copy:hover{border-color:var(--accent)}
.copy:focus-visible{outline:2px solid var(--accent)}
footer{border-top:1px solid var(--line); padding:28px 0; color:var(--faint); font-size:14px}
footer .wrap{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.3s; z-index:99}
.toast.show{opacity:1; transform:translate(-50%,0)}
.to-top{position:fixed; right:20px; bottom:20px; opacity:0; pointer-events:none; transition:.3s; z-index:40}
.to-top.show{opacity:1; pointer-events:auto}

@media (max-width:980px){
  .about,.feat,.contact{grid-template-columns:1fr}
  .ach{grid-template-columns:repeat(2,1fr)}
  .skills{grid-template-columns:1fr}
  .s-tabs{flex-direction:row; overflow-x:auto; padding-bottom:4px}
  .s-tab{white-space:nowrap}
  .phone-stage{order:-1}
}
@media (max-width:640px){
  section{padding:72px 0}
  .p-grid,.ach{grid-template-columns:1fr}
  .feat,.contact{padding:24px 20px}
  .steps{grid-template-columns:1fr}
  .phone{width:220px; height:440px}
  .stat b{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important; transition:none!important}
  .reveal{opacity:1; transform:none}
}
</style>
<script>
  (function(){ var t=null; try{ t=localStorage.getItem("theme"); }catch(e){}
    if(!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header>
  <nav class="wrap nav" aria-label="Main">
    <a class="logo" href="#home" id="logo"><i></i><span></span></a>
    <ul class="links" id="links">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#achievements">Achievements</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="nav-r">
      <button class="icon-btn" id="theme" aria-label="Switch colour theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-ico"></svg></button>
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="links">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>
  <div class="progress" id="progress"></div>
</header>

<main id="main">
  <section id="home"><div class="grid-bg"></div><div class="wrap hero" id="hero-wrap"><div class="reveal" id="hero"></div><div class="photo reveal hidden" id="photo"></div></div></section>
  <section id="about"><div class="wrap about" id="about-c"></div></section>

      <div class="phone-stage" aria-hidden="true"><div class="phone"><div class="screen"><div class="notch"></div>
        <div class="view active"><div class="app-h">New request</div>
          <div class="fld"><small>What do you need?</small>Scientific calculator (fx-991)</div>
          <div class="fld"><small>Budget</small>Under ₹1,200</div>
          <div class="fld"><small>Pickup near</small>Campus gate · 2 km</div>
          <span class="pill">Visible to 14 nearby shops</span><div class="fbtn">Post request</div></div>
        <div class="view"><div class="app-h">Offers coming in</div>
          <div class="offer"><div><b>Gupta Stationers</b><br><small>0.6 km · in stock</small></div><span class="price">₹1,050</span></div>
          <div class="offer"><div><b>Campus Books</b><br><small>0.2 km · in stock</small></div><span class="price">₹1,120</span></div>
          <div class="offer"><div><b>City Electronics</b><br><small>1.8 km · tomorrow</small></div><span class="price">₹990</span></div></div>
        <div class="view"><div class="app-h">Compare</div>
          <div class="offer best"><div style="flex:1"><b>City Electronics</b> <span class="pill">Best</span><div class="bar"><i style="width:82%"></i></div></div><span class="price" style="margin-left:8px">₹990</span></div>
          <div class="offer"><div style="flex:1"><b>Gupta Stationers</b><div class="bar"><i style="width:88%"></i></div></div><span class="price" style="margin-left:8px">₹1,050</span></div>
          <div class="offer"><div style="flex:1"><b>Campus Books</b><div class="bar"><i style="width:94%"></i></div></div><span class="price" style="margin-left:8px">₹1,120</span></div>
          <div class="fbtn">Accept offer · save ₹130</div></div>
      </div></div></div>
    </article>`;
  }

  /* ---------- Reveal + count-up ---------- */
  const countUp = el => {
    const end = +el.dataset.count, suf = el.dataset.suffix || "";
    if (reduce || PREVIEW) { el.textContent = end + suf; return; }
    const start = end > 1000 ? end - 30 : 0, t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1 - Math.pow(1-k,3);
      el.textContent = Math.round(start + (end-start)*e) + suf; if (k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in");
    $$("[data-count]", e.target).forEach(countUp);
    io.unobserve(e.target);
  }), {threshold:.15});
  function observeReveals(){
    $$(".reveal:not(.in), .tl-item:not(.in)").forEach((el,i) => {
      if (PREVIEW) { el.classList.add("in"); $$("[data-count]", el).forEach(countUp); return; }
      el.style.transitionDelay = (i % 4) * 60 + "ms"; io.observe(el);
    });
  }

  /* ---------- Typed roles ---------- */
  function startTyped(roles){
    const el = $("#typed");
    if (!el || reduce || roles.length < 2) return;
    let ri = 0, ci = roles[0].length, del = true;
    const tick = () => {
      if (!document.body.contains(el)) return;
      ci += del ? -1 : 1; el.textContent = roles[ri].slice(0, ci);
      let wait = del ? 35 : 65;
      if (del && ci <= 0) { del = false; ri = (ri+1) % roles.length; wait = 300; }
      else if (!del && ci >= roles[ri].length) { del = true; wait = 2000; }
      typedTimer = setTimeout(tick, wait);
    };
    typedTimer = setTimeout(tick, 2200);
  }

  /* ---------- HyperLocal stepper + downloads ---------- */
  function showStep(i){
    const steps = $$(".step"), views = $$(".view"), h = C.hyperlocal || {};
    if (!steps.length) return;
    stepCur = i;
    steps.forEach((s,j) => s.setAttribute("aria-selected", j===i));
    views.forEach((v,j) => { v.classList.toggle("active", j===i);
      if (j===i) $$(".offer", v).forEach(o => { o.style.animation="none"; void o.offsetHeight; o.style.animation=""; }); });
    const d = $("#step-desc"); if (d) d.textContent = arr(h.steps)[i]?.text || "";
  }
  function autoStep(){
    clearInterval(stepTimer);
    const n = $$(".step").length;
    if (!reduce && n > 1) stepTimer = setInterval(() => showStep((stepCur+1) % n), 4200);
  }
  const P = [{id:"android",name:"Android",note:".apk"},{id:"windows",name:"Windows",note:"installer"},{id:"macos",name:"macOS",note:".dmg"},{id:"linux",name:"Linux",note:"package"}];
  const ua = navigator.userAgent;
  const os = /Android/i.test(ua) ? "android" : /Win/i.test(ua) ? "windows" : (/Mac/i.test(ua) && !/iPhone|iPad/i.test(ua)) ? "macos" : /Linux/i.test(ua) ? "linux" : null;
  function initStepper(){
    stepCur = 0; showStep(0); autoStep();
    const menu = $("#dl-menu"), h = C.hyperlocal || {};
    if (!menu) return;
    const avail = P.filter(p => h[p.id]);
    if (!avail.length) { $(".dl").remove(); return; }
    const mine = avail.find(p => p.id === os);
    if (mine) $("#dl-label").textContent = "Download for " + mine.name;
    menu.innerHTML = [...avail].sort((a,b) => (b.id===os)-(a.id===os)).map(p =>
      `<a role="menuitem" href="${url(h[p.id])}" target="_blank" rel="noopener">${p.name}${p.id===os?" ✓":""} <small>${p.note}</small></a>`).join("");
  }
  const toggleMenu = o => { const m=$("#dl-menu"), b=$("#dl-btn"); if(!m) return; m.classList.toggle("open", o); b.setAttribute("aria-expanded", o); if (o) m.querySelector("a")?.focus(); };

  /* ---------- Skills ---------- */
  function showSkill(i){
    const sk = arr(C.skills), panel = $("#s-panel");
    if (!sk.length) { panel.innerHTML = ""; return; }
    $$(".s-tab").forEach((b,j) => { b.setAttribute("aria-selected", j===i); b.tabIndex = j===i ? 0 : -1; });
    panel.setAttribute("aria-labelledby", "st-"+i);
    const s = sk[i];
    panel.innerHTML = `<h3>${esc(s.name)}</h3><p>${esc(s.blurb)}</p><div class="s-list">${arr(s.items).filter(Boolean).map((x,k) => `<div class="s-item" style="animation-delay:${k*50}ms">${esc(x)}</div>`).join("")}</div>`;
  }

  /* ---------- Delegated interactions (bound once) ---------- */
  document.addEventListener("click", e => {
    const t = e.target;
    const f = t.closest(".filter");
    if (f) {
      $$(".filter").forEach(x => x.setAttribute("aria-pressed", x === f));
      const tag = f.dataset.f;
      $$("#p-grid .proj").forEach(c => {
        const show = tag === "all" || c.dataset.tags.split(" ").includes(tag);
        if (show) { c.classList.remove("hide"); requestAnimationFrame(() => c.classList.remove("fading")); }
        else { c.classList.add("fading"); setTimeout(() => c.classList.contains("fading") && c.classList.add("hide"), reduce ? 0 : 300); }
      });
      return;
    }
    const more = t.closest(".tl-more");
    if (more) { const o = more.nextElementSibling.classList.toggle("open"); more.setAttribute("aria-expanded", o); return; }
    const st = t.closest(".step");
    if (st) { showStep(+st.dataset.i); autoStep(); return; }
    const sk = t.closest(".s-tab");
    if (sk) { showSkill(+sk.dataset.i); return; }
    if (t.closest("#copy")) {
      const em = C.profile?.email || "";
      (navigator.clipboard?.writeText(em) || Promise.reject()).then(() => toast("Email copied"), () => toast(em));
      return;
    }
    if (t.closest("#dl-btn")) { e.stopPropagation(); toggleMenu(!$("#dl-menu").classList.contains("open")); return; }
    if (!t.closest("#dl-menu")) toggleMenu(false);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("#dl-menu")?.classList.contains("open")) { toggleMenu(false); $("#dl-btn").focus(); return; }
    const st = e.target.closest?.(".step");
    if (st && (e.key==="ArrowRight"||e.key==="ArrowLeft")) {
      const all = $$(".step"), i = +st.dataset.i, n = (i + (e.key==="ArrowRight" ? 1 : all.length-1)) % all.length;
      all[n].focus(); showStep(n); autoStep(); return;
    }
    const sk = e.target.closest?.(".s-tab");
    if (sk) {
      const all = $$(".s-tab"), i = +sk.dataset.i; let n = null;
      if (e.key==="ArrowDown"||e.key==="ArrowRight") n = (i+1) % all.length;
      if (e.key==="ArrowUp"||e.key==="ArrowLeft") n = (i-1+all.length) % all.length;
      if (n !== null) { e.preventDefault(); all[n].focus(); showSkill(n); }
    }
  });
  document.addEventListener("pointermove", e => {
    const c = e.target.closest?.(".spot"); if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  document.addEventListener("mouseover", e => { if (e.target.closest?.(".feat")) clearInterval(stepTimer); });
  document.addEventListener("mouseout", e => { const f = e.target.closest?.(".feat"); if (f && !f.contains(e.relatedTarget)) autoStep(); });

  /* ---------- Theme ---------- */
  const setIcon = () => { $("#theme-ico").innerHTML = root.dataset.theme === "light" ? I.moon : I.sun; };
  setIcon();
  $("#theme").addEventListener("click", () => {
    root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
    try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
    setIcon();
  });

  /* ---------- Mobile menu ---------- */
  const lk = $("#links"), mb = $("#menu-btn");
  mb.addEventListener("click", () => { const o = lk.classList.toggle("open"); mb.setAttribute("aria-expanded", o); });
  $$("#links a").forEach(a => a.addEventListener("click", () => { lk.classList.remove("open"); mb.setAttribute("aria-expanded", false); }));

  /* ---------- Scroll ---------- */
  const sections = $$("main section[id]");
  const navMap = Object.fromEntries($$("#links a").map(a => [a.getAttribute("href").slice(1), a]));
  function onScroll(){
    const h = document.documentElement;
    $("#progress").style.transform = `scaleX(${h.scrollTop / (h.scrollHeight - h.clientHeight || 1)})`;
    $("#to-top").classList.toggle("show", h.scrollTop > 700);
    let cur = null;
    sections.forEach(s => { if (s.getBoundingClientRect().top < innerHeight * .4) cur = s.id; });
    Object.entries(navMap).forEach(([id,a]) => a.classList.toggle("active", id === cur));
    const tl = $("#timeline"), r = tl.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (innerHeight * .6 - r.top) / (r.height || 1)));
    $("#tl-fill").style.height = Math.max(0, p * (r.height - 16)) + "px";
  }
  addEventListener("scroll", onScroll, {passive:true});
  $("#to-top").addEventListener("click", () => scrollTo({top:0, behavior: reduce ? "auto" : "smooth"}));

  /* ---------- Load content ---------- */
  let FALLBACK = {};
  try { FALLBACK = JSON.parse($("#default-content").textContent); } catch(e) {}

  if (PREVIEW) {
    // Live preview inside the admin editor
    render(FALLBACK);
    addEventListener("message", e => {
      if (e.source !== parent) return;
      if (location.protocol !== "file:" && e.origin !== location.origin) return;
      const d = e.data || {};
      if (d.type === "portfolio-preview" && d.content) render(d.content);
      if (d.type === "portfolio-scroll" && d.id) document.getElementById(d.id)?.scrollIntoView({block:"start"});
    });
    parent.postMessage({type:"portfolio-preview-ready"}, "*");
  } else {
    fetch("content.json?t=" + Date.now(), {cache:"no-store"})
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(render, () => render(FALLBACK));
  }
})();
</script>
</body>
</html>
